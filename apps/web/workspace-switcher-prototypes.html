gin-top:4px;color:#82909e}.selected-check{color:#507ba4;font-size:16px}.panel-actions{border-top:1px solid #e1e6ec;padding:8px}.action{width:100%;padding:11px 12px;background:transparent;display:flex;align-items:center;gap:12px;text-align:left;font-size:12px;color:#697d90;border-radius:5px}.action:hover{background:#edf2f7}.action .icon{width:20px;font-size:17px;text-align:center}.action .badge{margin-left:auto;background:#e9e2d6;color:#8b7553;padding:2px 6px;border-radius:4px;font-size:10px}.panel-footer{background:#f0f4f8;font-size:10px;color:#8c9aa8;padding:12px 20px}.rail{position:fixed;left:0;top:160px;bottom:0;width:82px;border-right:1px solid #cdd4dc;display:flex;align-items:center;flex-direction:column;gap:16px;padding-top:26px}.rail-button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;color:#8190a0;font-size:9px;min-width:65px;padding:5px}.rail-button .avatar{height:38px;width:38px}.rail-button.current:before{content:'';position:absolute;left:-9px;top:12px;width:3px;height:24px;background:#5b81a6;border-radius:3px}.rail-button.current .avatar{outline:2px solid #8ba9c6;outline-offset:3px}.rail-button small{font-size:9px}.rail-separator{width:26px;border-top:1px solid #ccd5de;margin:2px 0}.rail-add{font-size:22px;background:transparent;color:#8092a4;padding:8px}.rail-popover{position:fixed;top:182px;left:94px}.variant-b .main{padding-left:100px}.workspace-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}.owner-pill{font-size:10px;color:#7d8a96;background:#dfe5eb;padding:4px 7px;border-radius:4px}.search-trigger{min-width:248px;justify-content:space-between;font-size:12px;color:#758698;padding:12px 14px;display:flex;align-items:center;gap:20px}.key{font-family:inherit;font-size:10px;border:1px solid #ccd5de;border-radius:4px;color:#8b9baa;padding:2px 5px}.modal-scrim{position:fixed;inset:160px 0 0;background:#23374a26;backdrop-filter:blur(2px);z-index:30;display:flex;justify-content:center;align-items:flex-start;padding:78px 20px 30px}.command{width:520px;border-radius:15px}.command .panel-header{padding:20px 24px 14px}.search-box{margin:0 20px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #d6dfe8;padding:4px 2px 16px;color:#7790a9}.search-box input{background:transparent;border:0;outline:none;min-width:0;flex:1;font-size:17px;color:#3a526a}.search-box input::placeholder{color:#9aa8b6}.command .workspace-list{padding:0 12px 12px}.command .workspace-row{padding:15px 13px}.command .panel-actions{padding:8px 12px}.command .panel-footer{display:flex;justify-content:space-between}.empty{padding:24px;color:#8493a2;text-align:center;font-size:13px}.close-button{background:transparent;color:#8a9bab;font-size:11px;padding:3px 5px;border:1px solid #d5dfe8;border-radius:4px}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#304961;color:white;padding:12px 20px;border-radius:8px;z-index:50;font-size:13px;box-shadow:0 8px 24px #20354a30}.dialog-body{padding:0 24px 24px;font-size:13px;line-height:1.8;color:#718294}.dialog-body input{width:100%;border:1px solid #c9d4df;background:#fff;border-radius:7px;padding:11px;margin:10px 0 15px}.dialog-body button{padding:10px 16px}.dialog-body .info-row{padding:12px 0;border-bottom:1px solid #e1e7ee;display:flex;justify-content:space-between}.mock-label{font-size:10px;letter-spacing:1px;color:#99a7b5;margin-bottom:14px}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
      @media(max-width:850px){.prototype-bar{padding:0 16px;gap:10px}.prototype-label strong{font-size:12px}.variants button{padding:10px}.variants span{margin-right:4px}.app-header{padding:0 24px}.right-header .quiet{display:none}.main{padding:38px 30px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.variant-b .main{padding-left:108px}.note{font-size:10px;white-space:normal;bottom:12px;width:max-content}.search-trigger{min-width:160px}.left-header{gap:15px}}@media(max-width:580px){.prototype-bar{height:102px;align-items:flex-start;justify-content:center;flex-direction:column;gap:5px;padding:12px 18px}.prototype-label{font-size:9px}.prototype-label strong{display:inline;margin-left:10px}.variants button{padding:8px 10px}.app-header{height:76px;padding:0 18px}.brand{font-size:22px}.header-divider,.right-header{display:none}.left-header{width:100%;justify-content:space-between}.main{padding:30px 22px 100px}.page-heading h1{font-size:27px}.create-erd{padding:11px 12px;font-size:12px}.subline{font-size:12px}.gallery{grid-template-columns:1fr}.toolbar{margin-top:30px}.dropdown{left:auto;right:0}.rail{top:178px;width:64px}.rail-popover{top:191px;left:70px;width:calc(100vw - 80px)}.variant-b .main{padding-left:82px}.rail-button.current:before{left:0}.modal-scrim{inset:178px 0 0;padding:30px 14px}.command{width:100%}.note{display:none}.toolbar-right{gap:9px;font-size:10px}.search-trigger{min-width:146px;gap:8px}.variant-b .page-heading{align-items:start;flex-direction:column}.prototype-bar .variants{width:100%;justify-content:space-between}}

  <body>
    <div id="app"></div>
    <div id="live" class="screen-reader" aria-live="polite"></div>
    <script>
      const state={variant:['a','b','c'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'a',current:'Edusync',open:true,query:'',dialog:null};
      const spaces=[{name:'Edusync',initial:'E',projects:['klassboard-backend'],tables:[18],time:'2시간 전'},{name:'TY',initial:'T',projects:['ezerd','monya'],tables:[12,8],time:'어제'}];
      const descriptions={a:'현재 이름에서 바로 전환 · 가장 익숙한 배치',b:'워크스페이스를 항상 표시 · 자주 오갈 때 편리',c:'검색으로 빠르게 이동 · 워크스페이스가 많을 때 유리'};
      const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const current=()=>spaces.find(s=>s.name===state.current);
      function avatar(s){return `<span class="avatar ${s.name==='TY'?'ty':''}">${escapeHTML(s.initial)}</span>`}
      function rows(){const filtered=spaces.filter(s=>s.name.toLowerCase().includes(state.query.toLowerCase()));return filtered.length?filtered.map(s=>`<button class="workspace-row ${s.name===state.current?'selected':''}" data-space="${escapeHTML(s.name)}" aria-label="${escapeHTML(s.name)} 워크스페이스로 전환" aria-pressed="${s.name===state.current}">${avatar(s)}<span class="row-label"><strong>${escapeHTML(s.name)}</strong><small>소유자 <span aria-hidden="true">·</span> 프로젝트 ${s.projects.length}개</small></span>${s.name===state.current?'<span class="selected-check" aria-label="현재 선택됨">✓</span>':''}</button>`).join(''):'<p class="empty">일치하는 워크스페이스가 없어요.</p>'}
      function actions(){return `<div class="panel-actions"><button class="action" data-dialog="create"><span class="icon">＋</span>새 워크스페이스</button><button class="action" data-dialog="settings"><span class="icon">⚙</span>워크스페이스 설정</button><button class="action" data-dialog="invite"><span class="icon">✉</span>대기 중인 초대<span class="badge">1</span></button></div>`}
      function panel(extra=''){return `<section class="panel ${extra}" aria-label="워크스페이스 선택"><div class="panel-header">워크스페이스<span>${spaces.length}개</span></div><div class="workspace-list">${rows()}</div>${actions()}<div class="panel-footer">선택한 공간의 프로젝트만 표시됩니다.</div></section>`}
      function card(name,index){const names=index?['users','posts']:name==='klassboard-backend'?['classes','students']:['diagrams','tables'];return `<article class="erd-card"><div class="preview"><div class="diagram"><div class="mini-table"><b>${names[0]}</b><span>⌑ id <i>uuid</i></span><span>name <i>varchar</i></span><span>created_at <i>timestamp</i></span></div><div class="mini-table offset"><b>${names[1]}</b><span>⌑ id <i>uuid</i></span><span>↳ ${names[0]}_id</span><span>title <i>varchar</i></span><span>updated_at</span></div></div></div><div class="card-copy"><div class="card-title">${escapeHTML(name)}<span aria-hidden="true" style="color:#94a1ae;font-size:14px">⋯</span></div><div class="card-detail">테이블 ${current().tables[index]}개 <span aria-hidden="true">·</span> 관계 ${Math.max(3,current().tables[index]-4)}개</div><div class="card-footer"><span class="db-tag">PostgreSQL</span><span>${current().time} 수정</span></div></div></article>`}
      function render(){const s=current();document.body.className=`variant-${state.variant}`;document.getElementById('app').innerHTML=`<header class="prototype-bar"><div class="prototype-label">EZERD / DESIGN STUDY<strong>워크스페이스 전환, 세 가지 방향</strong></div><nav class="variants" aria-label="프로토타입 선택">${[['a','이름 드롭다운'],['b','워크스페이스 레일'],['c','검색 스위처']].map(([key,label])=>`<button data-variant="${key}" class="${key===state.variant?'active':''}" aria-pressed="${key===state.variant}"><span>${key.toUpperCase()}</span>${label}</button>`).join('')}</nav></header><header class="app-header"><div class="left-header"><div class="brand">EZ<i>ERD</i></div><span class="header-divider"></span>${state.variant==='a'?`<div class="workspace-anchor"><button class="switch-trigger raised" data-toggle aria-label="워크스페이스 선택 열기" aria-expanded="${state.open}">${avatar(s)}<span class="trigger-copy"><small>WORKSPACE</small>${escapeHTML(s.name)}</span><span class="chevron">⌄</span></button>${state.open?panel('dropdown'):''}</div>`:state.variant==='b'?`<div class="workspace-name">${escapeHTML(s.name)}<span class="owner-pill">소유자</span></div>`:`<button class="search-trigger raised" data-toggle aria-label="워크스페이스 검색 열기" aria-expanded="${state.open}"><span>⌕ &nbsp;${escapeHTML(s.name)}</span><kbd class="key">Ctrl K</kbd></button>`}</div><div class="right-header"><button class="quiet" data-message="도움말은 실제 서비스에서 연결됩니다.">도움말 ↗</button><span class="avatar user" aria-label="TY 사용자">TY</span></div></header>${state.variant==='b'?`<aside class="rail" aria-label="워크스페이스 빠른 이동">${spaces.map(w=>`<button class="rail-button ${w.name===state.current?'current':''}" data-rail="${escapeHTML(w.name)}" aria-label="${escapeHTML(w.name)} 선택 및 목록 열기">${avatar(w)}<small>${escapeHTML(w.name)}</small></button>`).join('')}<div class="rail-separator"></div><button class="rail-add" data-dialog="create" aria-label="새 워크스페이스 만들기">＋</button><button class="rail-add" data-toggle aria-label="모든 워크스페이스 보기">⋮</button></aside>${state.open?panel('rail-popover'):''}`:''}<main class="main"><p class="eyebrow">${escapeHTML(s.name).toUpperCase()} WORKSPACE</p><div class="page-heading"><div><h1>프로젝트</h1><p class="subline">아이디어를 구조로, 함께 만드는 데이터 설계.</p></div><button class="raised primary create-erd" data-message="새 프로젝트 만들기 예시입니다. 선택한 워크스페이스: ${escapeHTML(s.name)}">＋ &nbsp;새 프로젝트</button></div><div class="toolbar"><strong>전체 프로젝트 <span class="count">${s.projects.length}</span></strong><div class="toolbar-right"><span>최근 수정순 ↓</span><span aria-label="그리드 보기">▦</span></div></div><section class="gallery" aria-label="${escapeHTML(s.name)} 프로젝트">${s.projects.map(card).join('')}<button class="new-card" data-message="${escapeHTML(s.name)}에 프로젝트을 추가하는 예시입니다."><span class="plus">＋</span><span style="font-size:13px">새로운 설계 시작하기</span><small>빈 캔버스에서 자유롭게</small></button></section><p class="page-foot"><span class="dot"></span>${escapeHTML(s.name)}의 프로젝트만 보고 있어요 <span style="margin-left:auto">소유자 · TY</span></p></main><aside class="note"><b>OPTION ${state.variant.toUpperCase()}${state.variant==='a'?' · 추천':''}</b><span>${descriptions[state.variant]}</span><span style="color:#a2acb7">샘플 데이터</span></aside>${state.variant==='c'&&state.open?`<div class="modal-scrim" data-scrim><section class="panel command" role="dialog" aria-modal="true" aria-label="워크스페이스 검색"><div class="panel-header">워크스페이스로 이동<button class="close-button" data-close aria-label="검색 닫기">ESC</button></div><div class="search-box"><span style="font-size:24px">⌕</span><input id="workspace-search" aria-label="워크스페이스 이름 검색" placeholder="워크스페이스 검색…" value="${escapeHTML(state.query)}" autocomplete="off" /></div><div class="workspace-list" id="search-results">${rows()}</div>${actions()}<div class="panel-footer"><span>이름으로 찾고, 원하는 공간으로 이동하세요.</span><span><kbd class="key">esc</kbd> 닫기</span></div></section></div>`:''}${state.dialog?dialogMarkup():''}`;if(state.variant==='c'&&state.open&&!state.dialog){document.getElementById('workspace-search')?.focus()}if(state.dialog)document.querySelector('.modal-scrim:last-child button')?.focus()}
      function dialogMarkup(){const title={create:'새 워크스페이스',settings:'워크스페이스 설정',invite:'대기 중인 초대'}[state.dialog];return `<div class="modal-scrim" data-scrim><section class="panel command" role="dialog" aria-modal="true" aria-label="${title}"><div class="panel-header">${title}<button class="close-button" data-close aria-label="대화상자 닫기">닫기</button></div><div class="dialog-body"><p class="mock-label">INTERACTIVE PREVIEW · 샘플</p>${state.dialog==='create'?'<form id="create-form"><label for="new-name">워크스페이스 이름</label><input id="new-name" name="name" placeholder="예: Design team" required maxlength="24" /><button class="raised primary" type="submit">만들기</button></form><p style="margin-top:16px;font-size:11px">이 예시에서 만든 공간은 새로고침하면 사라집니다.</p>':state.dialog==='settings'?`<div class="info-row"><span>워크스페이스</span><strong>${escapeHTML(state.current)}</strong></div><div class="info-row"><span>내 역할</span><strong>소유자</strong></div><div class="info-row"><span>멤버</span><strong>TY</strong></div><p style="margin-top:18px">이름 변경과 멤버 관리는 선택한 디자인에 맞춰 상세 설계할 예정입니다.</p>`:'<div class="info-row"><strong>Design team</strong><span>편집자 초대</span></div><p style="margin:16px 0">초대받은 공간을 확인하는 화면 예시입니다.</p><button class="raised primary" data-accept>예시 초대 수락</button>'}</div></section></div>`}
      function close(){if(state.dialog)state.dialog=null;else state.open=false;render();document.querySelector('[data-toggle]')?.focus()}
      function toast(message){document.querySelector('.toast')?.remove();const element=document.createElement('div');element.className='toast';element.setAttribute('role','status');element.textContent=message;document.body.append(element);setTimeout(()=>element.remove(),3200)}
      document.addEventListener('click',event=>{const button=event.target.closest('button');if(button?.dataset.variant){state.variant=button.dataset.variant;state.open=true;state.dialog=null;state.query='';history.replaceState(null,'',`?variant=${state.variant}`);render();return}if(button?.hasAttribute('data-toggle')){state.open=!state.open;state.query='';render();return}if(button?.dataset.space){state.current=button.dataset.space;state.open=false;state.query='';render();document.getElementById('live').textContent=`${state.current} 워크스페이스로 전환했습니다.`;document.querySelector('[data-toggle]')?.focus();return}if(button?.dataset.rail){state.current=button.dataset.rail;state.open=true;render();return}if(button?.dataset.dialog){state.dialog=button.dataset.dialog;state.open=false;render();return}if(button?.hasAttribute('data-close')||event.target.hasAttribute('data-scrim')){close();return}if(button?.dataset.message){toast(button.dataset.message);return}if(button?.hasAttribute('data-accept')){if(!spaces.find(w=>w.name==='Design team'))spaces.push({name:'Design team',initial:'D',projects:[],tables:[],time:'방금'});state.current='Design team';state.dialog=null;render();toast('샘플 초대를 수락했어요.');return}if(state.open&&state.variant!=='c'&&!event.target.closest('.panel,.workspace-anchor,.rail')){state.open=false;render()}});
      document.addEventListener('input',event=>{if(event.target.id==='workspace-search'){state.query=event.target.value;document.getElementById('search-results').innerHTML=rows()}});
      document.addEventListener('submit',event=>{if(event.target.id!=='create-form')return;event.preventDefault();const name=new FormData(event.target).get('name').trim();if(!name)return;if(spaces.some(w=>w.name===name)){toast('이미 있는 워크스페이스 이름이에요.');return}spaces.push({name,initial:Array.from(name)[0].toUpperCase(),projects:[],tables:[],time:'방금'});state.current=name;state.dialog=null;state.open=false;render();toast('예시 워크스페이스를 만들었어요.');});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'){close();return}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();state.variant='c';state.open=true;state.query='';state.dialog=null;history.replaceState(null,'','?variant=c');render();return}if(event.key==='Tab'){const dialog=document.querySelector('[role="dialog"]');if(!dialog)return;const focusable=[...dialog.querySelectorAll('button,input')];const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});render();
    </script>
  </body>
</html>
