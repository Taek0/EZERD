<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EZERD · 버튼 디자인 비교</title>
    <link rel="stylesheet" href="/fonts/apple-sd-gothic-neo/fonts.css" />
    <style>
      :root { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #202327; background: #e9ecef; font-synthesis: none; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { max-width: 1520px; padding: 34px 40px 24px; margin: auto; }
      header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid #c8cdd4; }
      .brand { font-size: 25px; font-weight: 800; letter-spacing: -1px; }
      .brand span { color: #305be7; }
      .edition { color: #59616b; font-size: 11px; letter-spacing: 2px; }
      .intro { display: flex; justify-content: space-between; align-items: flex-end; margin: 28px 0 25px; gap: 24px; }
      .eyebrow { margin: 0 0 10px; font-size: 11px; letter-spacing: 2px; color: #59616b; }
      h1 { font-size: 32px; letter-spacing: -1.2px; margin: 0; line-height: 1.3; }
      .intro p:last-child { margin: 0; font-size: 13px; color: #59616b; line-height: 1.65; }
      .reference { display: flex; gap: 16px; align-items: center; margin-bottom: 28px; padding: 17px 20px; border: 1px solid #cbd2db; border-radius: 12px; background: #e6eaef; flex-wrap: wrap; }
      .reference > div:first-child { margin-right: 9px; }
      .reference b { display: block; font-size: 12px; margin-bottom: 4px; }
      .reference small { color: #59616b; font-size: 11px; }
      .reference-note { margin-left: auto; color: #59616b; font-size: 12px; }
      .options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
      .option { --radius: 8px; --edge: transparent; --normal: linear-gradient(145deg, #f8f9fb, #e9edf2); --primary: linear-gradient(145deg, #eaf0f7, #dce5ef); --raised: 3px 3px 8px #aeb7c433, -3px -3px 8px #ffffffcc, inset 0 1px 0 #ffffffd9; --inset: inset 2px 2px 5px #aeb7c440, inset -2px -2px 5px #ffffffb3; min-width: 0; }
      .option-b { --radius: 7px; --edge: #c4cdd9; --normal: linear-gradient(180deg, #f6f8fa, #edf0f4); --primary: linear-gradient(180deg, #e8eff8, #dfe8f2); --raised: 0 1px 2px #52647a17, inset 0 1px 0 #ffffff; --inset: inset 0 2px 3px #5b6f871f; }
      .option-c { --radius: 12px; --edge: transparent; --normal: linear-gradient(145deg, #f5f7f9, #e4e9ef); --primary: linear-gradient(145deg, #e7eef8, #d7e2ef); --raised: 4px 4px 9px #aab5c444, -4px -4px 9px #ffffffdb, inset 0 1px 0 #ffffffcc; --inset: inset 3px 3px 6px #a8b5c74d, inset -3px -3px 6px #ffffffcc; }
      .option-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
      .letter { width: 40px; height: 40px; border: 1px solid #b9c4d2; border-radius: 50%; display: grid; place-items: center; color: #294f79; font-size: 21px; font-weight: 600; flex: none; }
      h2 { font-size: 20px; margin: 0 0 5px; letter-spacing: -.5px; }
      .option-head p { margin: 0; font-size: 12px; color: #59616b; }
      .preview { background: #e9ecef; border: 1px solid #c6cdd6; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 20px #66778c08; }
      .scene { padding: 20px; border-bottom: 1px solid #cbd2db; }
      .scene:last-child { border-bottom: 0; }
      .section-label { font-size: 10px; letter-spacing: 1.25px; font-weight: 600; color: #626d7b; display: flex; align-items: center; gap: 9px; margin-bottom: 15px; }
      .section-label span { width: 16px; height: 1px; background: #7a8899; }
      .project-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
      .project-line strong { font-size: 18px; font-weight: 700; letter-spacing: -.5px; }
      .project-line small { color: #647286; font-size: 11px; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .row + .row { margin-top: 13px; }
      button { font-family: inherit; }
      .btn { --radius: 8px; --edge: transparent; --normal: linear-gradient(145deg, #f8f9fb, #e9edf2); --primary: linear-gradient(145deg, #eaf0f7, #dce5ef); --raised: 3px 3px 8px #aeb7c433, -3px -3px 8px #ffffffcc, inset 0 1px 0 #ffffffd9; --inset: inset 2px 2px 5px #aeb7c440, inset -2px -2px 5px #ffffffb3; }
      .option .btn { --radius: inherit; --edge: inherit; --normal: inherit; --primary: inherit; --raised: inherit; --inset: inherit; }
      .btn { min-height: 36px; display: inline-flex; justify-content: center; align-items: center; gap: 6px; border: 1px solid var(--edge); border-radius: var(--radius); padding: 7px 11px; background: var(--normal); box-shadow: var(--raised); color: #414651; font-size: 13px; font-weight: 600; line-height: 20px; white-space: nowrap; cursor: pointer; transition: background 140ms ease, box-shadow 140ms ease, color 140ms ease; }
      .btn.primary { background: var(--primary); color: #294f79; }
      .btn:hover:not(:disabled), .btn.hover { background: #dfe7f0; color: #24476d; }
      .btn:active:not(:disabled), .btn.pressed { box-shadow: var(--inset); background: #dce5ef; }
      .btn:focus-visible, .btn.focus { outline: 2px solid #305be7; outline-offset: 3px; }
      .btn.selected, .btn[aria-pressed='true'] { background: #dce7f4; color: #234f80; box-shadow: var(--inset); }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .btn.danger { color: #9e3434; background: #f4e9e9; border-color: #dcbfc0; box-shadow: 0 1px 2px #8c3b3b0a; }
      .btn.danger:hover { background: #eddbdb; }
      .btn.icon { width: 36px; padding: 7px; }
      .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      .canvas { padding: 12px; border-radius: 9px; background-color: #f4f6f8; background-image: radial-gradient(#b7c2cf .7px, transparent .7px); background-size: 14px 14px; margin-top: 15px; height: 78px; display: flex; align-items: center; justify-content: center; gap: 0; }
      .entity { padding: 9px 16px; border: 1px solid #bcc8d8; border-radius: 6px; background: #f5f7fa; color: #536276; font-size: 11px; font-weight: 600; }
      .connector { width: 36px; height: 1px; background: #9eafc5; }
      .property { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 16px; }
      .property span { color: #637081; font-size: 12px; }
      .property b { font-size: 13px; font-weight: 500; }
      .state-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px; }
      .state { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
      .state small { color: #687486; font-size: 10px; }
      .state .btn { min-width: 70px; }
      .summary { font-size: 12px; color: #536174; line-height: 1.65; margin: 13px 2px 0; }
      .summary strong { font-weight: 600; color: #294f79; }
      footer { display: flex; align-items: center; justify-content: space-between; padding-top: 23px; font-size: 11px; color: #657081; gap: 15px; }
      #feedback { color: #294f79; min-height: 16px; }
      @media (max-width: 1100px) { main { padding: 28px 24px; } .options { gap: 14px; } .scene { padding: 16px 13px; } .btn { padding: 7px 9px; font-size: 12px; } .row { gap: 8px; } .state .btn { min-width: 61px; } }
      @media (max-width: 850px) { .options { grid-template-columns: 1fr; gap: 32px; } .intro { display: block; } .intro p:last-child { margin-top: 12px; } .reference-note { margin-left: 0; width: 100%; } .preview { display: grid; grid-template-columns: 1fr 1fr; } .scene:nth-child(odd) { border-right: 1px solid #cbd2db; } .scene:nth-child(3) { border-bottom: 0; } .scene { padding: 20px; } }
      @media (max-width: 540px) { main { padding: 22px 16px; } h1 { font-size: 27px; } .edition { font-size: 9px; letter-spacing: 1px; } .preview { display: block; } .scene:nth-child(odd) { border-right: 0; } .scene:nth-child(3) { border-bottom: 1px solid #cbd2db; } footer { display: block; line-height: 1.7; } }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">EZ<span>ERD</span></div>
        <div class="edition">BUTTON DESIGN STUDY / 01</div>
      </header>
      <div class="intro">
        <div>
          <p class="eyebrow">HOME → PROJECT</p>
          <h1>어느 화면에서나, 같은 버튼의 감각.</h1>
        </div>
        <p>
          홈 화면의 청회색과 부드러운 입체감을 기준으로<br />모서리 · 경계선 · 그림자의 세 가지
          방향을 비교합니다.
        </p>
      </div>
      <div class="reference">
        <div><b>현재 홈의 기준</b><small>실제 버튼의 색상·그림자 사용</small></div>
        <button class="btn primary">＋ 프로젝트 만들기</button><button class="btn">내보내기</button
        ><button class="btn">이름 수정</button
        ><span class="reference-note">청회색 / 8px 모서리 / 부드러운 양방향 그림자</span>
      </div>
      <div class="options" id="options"></div>
      <footer>
        <span
          >세 안 모두 같은 기능·크기·배치로 비교 · 버튼에 마우스를 올리거나 Tab 키로 포커스를
          확인하세요.</span
        ><span id="feedback" role="status"
          >디자인 미리보기 · 실제 프로젝트에는 반영되지 않습니다.</span
        >
      </footer>
    </main>
    <script>
      const icons = {
        plus: '<path d="M8 3v10M3 8h10"/>',
        layers: '<path d="m8 2 6 3.5L8 9 2 5.5 8 2ZM2 8.5 8 12l6-3.5M2 11.5 8 12.5l6-1"/>',
        panel: '<rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M10 3v10"/>',
        chat: '<path d="M4 12H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H8l-4 2v-2Z"/>',
      };
      const icon = name => `<svg viewBox="0 0 16 16" aria-hidden="true">${icons[name]}</svg>`;
      const variants = [
        { id: 'A', className: '', title: '홈 그대로', subtitle: '익숙한 입체감을 프로젝트까지', note: '<strong>가장 가까운 통일.</strong> 홈의 8px 모서리와 부드러운 그림자를 그대로 이어갑니다.' },
        { id: 'B', className: 'option-b', title: '얇고 또렷하게', subtitle: '섬세한 경계선으로 정돈된 인상', note: '<strong>더 명확한 구분.</strong> 7px 모서리와 얇은 선, 낮은 그림자로 도구가 많은 화면을 정돈합니다.' },
        { id: 'C', className: 'option-c', title: '둥글고 부드럽게', subtitle: '조금 더 둥근 모서리와 깊이감', note: '<strong>더 부드러운 인상.</strong> 12px 모서리와 넓은 그림자로 홈의 입체감을 확장합니다.' },
      ];
      document.getElementById('options').innerHTML = variants.map(v => `
        <article class="option ${v.className}" aria-labelledby="title-${v.id}">
          <div class="option-head"><span class="letter">${v.id}</span><div><h2 id="title-${v.id}">${v.title}</h2><p>${v.subtitle}</p></div></div>
          <div class="preview">
            <section class="scene"><div class="section-label"><span></span>01 / 홈 · 프로젝트 관리</div><div class="project-line"><strong>우리 팀의 설계.</strong><small>03 PROJECTS</small></div><div class="row"><button class="btn primary">${icon('plus')}프로젝트 만들기</button><button class="btn">가져오기</button></div><div class="row"><button class="btn">내보내기</button><button class="btn">이름 수정</button><button class="btn">보관</button></div></section>
            <section class="scene"><div class="section-label"><span></span>02 / 프로젝트 · 편집 도구</div><div class="row"><button class="btn primary">${icon('plus')}테이블</button><button class="btn">${icon('layers')}도메인</button><button class="btn icon" aria-label="속성 패널 표시" aria-pressed="true">${icon('panel')}</button><button class="btn icon" aria-label="댓글 표시" aria-pressed="false">${icon('chat')}</button></div><div class="canvas" aria-hidden="true"><div class="entity">CUSTOMERS</div><div class="connector"></div><div class="entity">ORDERS</div></div></section>
            <section class="scene"><div class="section-label"><span></span>03 / 속성 패널 · 편집과 저장</div><div class="property"><span>선택한 테이블</span><b>customers · 고객</b></div><div class="row"><button class="btn">${icon('plus')}컬럼 추가</button><button class="btn primary">변경 저장</button><button class="btn">취소</button></div></section>
            <section class="scene"><div class="section-label"><span></span>04 / 상태별 비교</div><div class="state-grid"><div class="state"><small>기본</small><button class="btn primary">저장</button></div><div class="state"><small>마우스 오버</small><button class="btn primary hover">저장</button></div><div class="state"><small>누름</small><button class="btn primary pressed">저장</button></div><div class="state"><small>키보드 포커스</small><button class="btn primary focus">저장</button></div><div class="state"><small>선택됨</small><button class="btn selected" aria-pressed="true">속성</button></div><div class="state"><small>비활성</small><button class="btn primary" disabled>저장</button></div><div class="state"><small>위험한 작업</small><button class="btn danger">삭제</button></div></div></section>
          </div><p class="summary">${v.note}</p>
        </article>`).join('');
      document.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button || button.disabled) return;
        if (button.hasAttribute('aria-pressed')) {
          const selected = button.getAttribute('aria-pressed') !== 'true';
          button.setAttribute('aria-pressed', String(selected));
          button.classList.toggle('selected', selected);
        }
        const option = button.closest('.option');
        const prefix = option ? `${option.querySelector('.letter').textContent}안` : '현재 홈';
        document.getElementById('feedback').textContent = `${prefix} · ${button.getAttribute('aria-label') || button.textContent.trim()} 버튼 미리보기`;
      });
    </script>
  </body>
</html>
