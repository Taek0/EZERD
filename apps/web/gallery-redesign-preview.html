<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EZERD · 갤러리 UI 미리보기</title>
    <link rel="stylesheet" href="/fonts/apple-sd-gothic-neo/fonts.css" />
    <style>
      :root{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#263341;background:#e9ecef;font-synthesis:none;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;user-select:none;-webkit-user-select:none}button:focus{outline:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #759bc4;outline-offset:4px}input{user-select:text}h1,h2,p{margin:0}.preview-bar{height:34px;background:#293b4e;color:#d7e2ec;display:flex;align-items:center;justify-content:center;font-size:12px;gap:12px;letter-spacing:.2px}.preview-bar span{color:#a8b9ca}.app-header{height:92px;border-bottom:1px solid #cdd4dc;display:flex;align-items:center;justify-content:space-between;padding:0 46px;gap:24px}.left-header,.right-header{display:flex;align-items:center;gap:26px}.brand{font-size:27px;font-weight:800;letter-spacing:-1.5px}.brand i{font-style:normal;color:#6685a5}.header-divider{height:28px;width:1px;background:#c8d0d9}.workspace-anchor{position:relative}.raised{background:linear-gradient(145deg,#f8f9fb,#e9edf2);box-shadow:4px 4px 9px #ccd1d7,-4px -4px 9px #fff;border-radius:9px;transition:box-shadow .17s,transform .17s}.raised:hover{box-shadow:5px 5px 13px #c6cdd5,-5px -5px 13px #fff;transform:translateY(-1px)}.raised:active{transform:translateY(0)}.switch-trigger{display:flex;gap:13px;align-items:center;padding:10px 14px;min-width:216px;text-align:left}.avatar{width:37px;height:37px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#dce6ef;color:#3a6288;font-size:16px;font-weight:700;flex-shrink:0}.avatar.ty{background:#e7e0d8;color:#76644e}.avatar.user{border-radius:50%;font-size:13px;background:#dce0e5}.trigger-copy{flex:1;font-size:16px;font-weight:650}.trigger-copy small{display:block;font-size:10px;letter-spacing:1.1px;color:#738191;font-weight:500;margin-bottom:3px}.chevron{transition:transform .17s;color:#778493}.switch-trigger[aria-expanded=true] .chevron{transform:rotate(180deg)}.quiet{background:transparent;font-size:14px;color:#687686;padding:8px;border-radius:6px}.quiet:hover{background:#dfe6ec}.right-header{gap:18px}.main{max-width:1260px;margin:auto;padding:58px 62px 44px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2.4px;color:#8190a0;margin-bottom:15px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:24px}.page-heading h1{font-size:32px;letter-spacing:-1px;font-weight:700}.subline{font-size:15px;color:#74818d;margin-top:12px}.primary{background:linear-gradient(145deg,#eaf0f7,#dce5ef);color:#294f79;font-weight:650}.create-erd{padding:15px 23px;font-size:15px}.toolbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cbd3dc;margin-top:42px;padding-bottom:15px;gap:20px}.tabs{display:flex;gap:21px;align-items:center}.tab{position:relative;background:transparent;padding:10px 0;color:#84909d;font-size:14px;white-space:nowrap}.tab.active{color:#334b62;font-weight:650}.tab.active:after{content:'';position:absolute;bottom:-16px;left:0;right:0;height:2px;background:#6685a5}.count{display:inline-block;background:#dbe3eb;color:#5c7086;border-radius:5px;padding:2px 6px;font-size:12px;margin-left:6px}.toolbar-right{display:flex;gap:18px;align-items:center;color:#73808d;font-size:14px}.search{display:flex;align-items:center;gap:9px;background:#e2e7ed;border-radius:7px;padding:9px 12px;color:#8594a2}.search input{width:150px;background:transparent;border:0;font-size:14px;outline-offset:6px}.search input::placeholder{color:#8b98a5}.sort{border:0;background:transparent;font-size:14px;max-width:122px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px;margin-top:27px}.erd-card{border:1px solid #d2dae3;border-radius:12px;background:#f0f3f6;box-shadow:0 6px 18px #26364605;transition:transform .18s,box-shadow .18s;position:relative}.erd-card:hover{transform:translateY(-3px);box-shadow:0 12px 25px #2636460d}.card-open{width:100%;padding:0;background:transparent;text-align:left;border-radius:12px}.preview{height:196px;background-color:#f7f9fb;background-image:radial-gradient(#dbe2e9 .8px,transparent .8px);background-size:12px 12px;padding:25px 18px;position:relative;overflow:hidden;border-radius:12px 12px 0 0}.diagram{display:flex;justify-content:center;align-items:center;height:100%;gap:24px}.mini-table{width:98px;background:#fff;border:1px solid #cbd7e4;border-radius:5px;position:relative;box-shadow:0 3px 10px #435e7710;transform:rotate(-1deg)}.mini-table+.mini-table{transform:rotate(1deg)}.mini-table+.mini-table:before{content:'';position:absolute;left:-26px;top:38px;width:25px;border-top:1.5px solid #89a4bf}.mini-table b{display:block;padding:8px;background:#e6eef7;font-size:10px;color:#446384;border-bottom:1px solid #cbd7e4}.mini-table span{display:block;font-size:9px;color:#8693a0;padding:4px 8px}.mini-table i{font-size:8px;font-style:normal;float:right;color:#b2bbc5}.mini-table.offset{margin-top:38px}.card-copy{padding:21px 21px 20px}.card-title{font-size:18px;font-weight:650;letter-spacing:-.2px;padding-right:22px}.card-detail{font-size:13px;color:#7b8896;margin-top:10px}.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:24px;font-size:12px;color:#7b8997}.db-tag{font-size:11px;color:#63809b;background:#e4ebf2;padding:5px 8px;border-radius:5px}.more{position:absolute;right:12px;top:211px;width:33px;height:32px;background:transparent;color:#8493a2;font-size:22px;border-radius:6px}.more:hover{background:#e1e7ee}.new-card{border:1px dashed #bfcbd7;border-radius:12px;min-height:346px;background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;color:#6d8093;transition:background .18s,border-color .18s}.new-card:hover{background:#eef2f6;border-color:#809ab5}.new-card .plus{font-size:29px;font-weight:300;color:#7e95ad;margin-bottom:4px}.new-card small{font-size:13px;color:#93a0ac}.page-foot{margin-top:31px;display:flex;gap:9px;align-items:center;color:#82909e;font-size:13px}.dot{width:5px;height:5px;background:#89a49b;border-radius:50%}.panel{background:#f9fbfd;border:1px solid #d0d9e3;border-radius:12px;box-shadow:0 18px 45px #283d5726;z-index:20;width:320px;overflow:hidden}.dropdown{position:absolute;top:calc(100% + 13px);left:0;opacity:0;transform:translateY(-7px) scale(.98);transform-origin:top left;visibility:hidden;pointer-events:none;transition:opacity .17s,transform .17s,visibility .17s}.dropdown.open{opacity:1;transform:translateY(0) scale(1);visibility:visible;pointer-events:auto}.panel-header{padding:20px 20px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8a99a9;font-weight:600}.panel-header span{font-weight:400}.workspace-list{padding:0 8px 8px}.workspace-row{width:100%;background:transparent;display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:7px;text-align:left}.workspace-row:hover{background:#edf2f7}.workspace-row.selected{background:#eaf0f6}.workspace-row:focus-visible{outline-offset:-3px;outline-width:2px}.row-label{flex:1}.row-label strong{display:block;font-size:16px;font-weight:650}.row-label small{display:block;font-size:13px;margin-top:4px;color:#82909e}.selected-check{color:#507ba4;font-size:17px}.panel-actions{border-top:1px solid #e1e6ec;padding:8px}.action{width:100%;padding:12px;background:transparent;display:flex;align-items:center;gap:12px;text-align:left;font-size:14px;color:#697d90;border-radius:6px}.action:hover{background:#edf2f7}.action .icon{width:20px;font-size:18px;text-align:center}.badge{margin-left:auto;background:#e9e2d6;color:#8b7553;padding:2px 7px;border-radius:4px;font-size:12px}.panel-footer{background:#f0f4f8;font-size:12px;color:#8c9aa8;padding:13px 20px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#304961;color:white;padding:14px 23px;border-radius:9px;z-index:50;font-size:14px;box-shadow:0 8px 24px #20354a30;max-width:90vw}.empty{grid-column:1/-1;padding:55px;text-align:center;color:#7a8a9a}.dialog{width:420px;max-width:calc(100vw - 36px);border:1px solid #d0d9e3;background:#f5f8fb;border-radius:14px;padding:28px;color:#354c63;box-shadow:0 20px 70px #273c5433}.dialog::backdrop{background:#23374a35;backdrop-filter:blur(3px)}.dialog h2{font-size:22px;margin-bottom:12px}.dialog p{font-size:14px;color:#82909e;line-height:1.7}.dialog label{display:block;font-size:14px;margin-top:23px}.dialog input{width:100%;margin-top:9px;border:1px solid #c9d4df;background:#fff;border-radius:7px;padding:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:14px;margin-top:25px}.dialog-actions button{padding:11px 18px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.gallery.enter{animation:appear .22s ease-out}@keyframes appear{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
      @media(max-width:1000px){.main{padding:40px 30px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.app-header{padding:0 30px}.toolbar-right{gap:10px}.search input{width:110px}}@media(max-width:620px){.app-header{padding:0 20px;height:86px}.left-header{gap:16px}.header-divider,.right-header .quiet{display:none}.switch-trigger{min-width:175px}.brand{font-size:24px}.right-header{gap:0}.main{padding:34px 20px}.gallery{grid-template-columns:1fr}.page-heading{align-items:flex-start}.page-heading h1{font-size:28px}.subline{font-size:14px;max-width:200px;line-height:1.6}.create-erd{padding:12px;font-size:14px;white-space:nowrap}.toolbar{flex-wrap:wrap;gap:20px;margin-top:28px}.toolbar-right{width:100%;justify-content:space-between}.tab.active:after{bottom:-8px}.search{flex:1}.search input{width:100%}.dropdown{left:-80px;width:300px}.preview-bar span{display:none}.page-foot{font-size:12px}.panel-header{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
    </style>
  </head>
  <body>
    <div class="preview-bar">
      미리보기 — 승인 전 <span>모든 변경은 샘플에만 적용되며, 새로고침하면 초기화됩니다.</span>
    </div>
    <header class="app-header">
      <div class="left-header">
        <div class="brand">EZ<i>ERD</i></div>
        <span class="header-divider"></span>
        <div class="workspace-anchor">
          <button
            id="switch"
            class="switch-trigger raised"
            aria-expanded="false"
            aria-controls="workspace-menu"
            aria-haspopup="menu"
          ></button>
          <div id="workspace-menu" class="panel dropdown" inert>
            <div class="panel-header">워크스페이스 <span>2개의 공간</span></div>
            <div
              id="workspace-list"
              class="workspace-list"
              role="menu"
              aria-label="워크스페이스 선택"
            ></div>
            <div class="panel-actions">
              <button class="action" data-info="워크스페이스 설정">
                <span class="icon">⚙</span>워크스페이스 설정</button
              ><button class="action" data-info="대기 중인 초대">
                <span class="icon">↗</span>대기 중인 초대 <span class="badge">1</span></button
              ><button class="action" data-info="새 워크스페이스 만들기">
                <span class="icon">＋</span>새 워크스페이스 만들기
              </button>
            </div>
            <div class="panel-footer">공간마다 독립적인 프로젝트와 멤버</div>
          </div>
        </div>
      </div>
      <div class="right-header">
        <button class="quiet" data-info="도움말">도움말 ↗</button
        ><button class="avatar user" data-info="내 프로필" aria-label="TY 내 프로필">TY</button>
      </div>
    </header>
    <main class="main">
      <p id="eyebrow" class="eyebrow"></p>
      <div class="page-heading">
        <div>
          <h1>프로젝트</h1>
          <p class="subline">아이디어를 구조로, 함께 만드는 데이터 설계.</p>
        </div>
        <button class="raised primary create-erd" data-create>＋ &nbsp;새 프로젝트</button>
      </div>
      <div class="toolbar">
        <div class="tabs">
          <button class="tab active" id="all" aria-pressed="true">
            전체 프로젝트 <span class="count" id="count"></span></button
          ><button class="tab" id="archived" aria-pressed="false">
            보관함 <span id="archived-count"></span>
          </button>
        </div>
        <div class="toolbar-right">
          <label class="search"
            ><span aria-hidden="true">⌕</span
            ><input
              id="search"
              placeholder="프로젝트 검색"
              aria-label="프로젝트 검색"
              type="search" /></label
          ><select class="sort" id="sort" aria-label="프로젝트 정렬">
            <option value="recent">최근 수정순</option>
            <option value="name">이름순</option>
          </select>
        </div>
      </div>
      <section class="gallery" id="gallery" aria-label="프로젝트 목록"></section>
      <div class="page-foot">
        <span class="dot"></span><span id="foot"></span
        ><span style="margin-left:auto">소유자 · TY</span>
      </div>
    </main>
    <dialog class="dialog" id="project-dialog">
      <form id="project-form">
        <h2 id="dialog-title">새 프로젝트</h2>
        <p>선택한 워크스페이스에 새로운 설계를 추가합니다.</p>
        <label for="project-name">프로젝트 이름</label
        ><input
          id="project-name"
          maxlength="60"
          required
          autocomplete="off"
          placeholder="예: service-backend"
        />
        <div class="dialog-actions">
          <button type="button" class="quiet" data-cancel>취소</button
          ><button class="raised primary" type="submit">확인</button>
        </div>
      </form>
    </dialog>
    <dialog class="dialog" id="manage-dialog">
      <h2 id="manage-title"></h2>
      <p>프로젝트 관리 · 미리보기</p>
      <div style="margin-top:20px">
        <button class="action" id="rename">이름 변경</button
        ><button class="action" id="archive">보관하기</button>
      </div>
      <div class="dialog-actions"><button class="quiet" data-cancel>닫기</button></div>
    </dialog>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <script>
      const $ = id => document.getElementById(id);
      const spaces=[{name:'Edusync',initial:'E',projects:[{id:1,name:'klassboard-backend',tables:18,relations:14,time:'2시간 전',entities:['users','classrooms']}]},{name:'TY',initial:'T',projects:[{id:2,name:'ezerd',tables:12,relations:8,time:'어제',entities:['projects','tables']},{id:3,name:'monya',tables:8,relations:4,time:'어제',entities:['accounts','transactions']}]}];
      let current=0,open=false,archived=false,selected=null,editing=false,toastTimer;
      const escapeHTML=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const avatar=s=>`<span class="avatar ${s.initial==='T'?'ty':''}">${s.initial}</span>`;
      function header(){const s=spaces[current];$('switch').innerHTML=`${avatar(s)}<span class="trigger-copy"><small>WORKSPACE</small>${s.name}</span><span class="chevron" aria-hidden="true">⌄</span>`;$('switch').setAttribute('aria-label',`${s.name}, 워크스페이스 선택`);$('workspace-list').innerHTML=spaces.map((s,i)=>`<button class="workspace-row ${i===current?'selected':''}" role="menuitemradio" aria-checked="${i===current}" data-space="${i}">${avatar(s)}<span class="row-label"><strong>${s.name}</strong><small>소유자 · 프로젝트 ${s.projects.filter(p=>!p.archived).length}개</small></span>${i===current?'<span class="selected-check" aria-hidden="true">✓</span>':''}</button>`).join('');$('eyebrow').textContent=`${s.name.toUpperCase()} WORKSPACE`;$('foot').textContent=`${s.name}의 프로젝트만 보고 있어요`;}
      function gallery(animate=false){const s=spaces[current];const query=$('search').value.trim().toLowerCase();let projects=s.projects.filter(p=>Boolean(p.archived)===archived&&p.name.toLowerCase().includes(query));if($('sort').value==='name')projects=[...projects].sort((a,b)=>a.name.localeCompare(b.name));$('count').textContent=s.projects.filter(p=>!p.archived).length;$('archived-count').textContent=s.projects.filter(p=>p.archived).length?`· ${s.projects.filter(p=>p.archived).length}`:'';for(const id of ['all','archived']){const active=(id==='archived')===archived;$(id).classList.toggle('active',active);$(id).setAttribute('aria-pressed',active)}$('gallery').innerHTML=projects.map(p=>`<article class="erd-card"><button class="card-open" data-open="${p.id}" aria-label="${escapeHTML(p.name)} 프로젝트 열기"><div class="preview"><div class="diagram">${p.entities.map((name,i)=>`<div class="mini-table ${i?'offset':''}"><b>${name}</b><span>⌑ id <i>uuid</i></span><span>${i?'↳ '+p.entities[0]+'_id':'name'} <i>${i?'uuid':'varchar'}</i></span><span>${i?'title':'created_at'} <i>${i?'varchar':'date'}</i></span>${i?'<span>updated_at <i>date</i></span>':''}</div>`).join('')}</div></div><div class="card-copy"><div class="card-title">${escapeHTML(p.name)}</div><div class="card-detail">테이블 ${p.tables}개 &nbsp;·&nbsp; 관계 ${p.relations}개</div><div class="card-footer"><span class="db-tag">PostgreSQL</span><span>${p.time} 수정</span></div></div></button><button class="more" data-manage="${p.id}" aria-label="${escapeHTML(p.name)} 프로젝트 관리">⋯</button></article>`).join('')+(!archived&&!query?'<button class="new-card" data-create><span class="plus">＋</span><span>새로운 설계 시작하기</span><small>빈 캔버스에서 자유롭게</small></button>':'')+(!projects.length&&(archived||query)?'<p class="empty">'+(query?'검색 결과가 없어요.':'보관된 프로젝트가 없어요.')+'</p>':'');if(animate){$('gallery').classList.remove('enter');requestAnimationFrame(()=>$('gallery').classList.add('enter'))}}
      function setOpen(value,keyboard=false){open=value;$('switch').setAttribute('aria-expanded',value);$('workspace-menu').classList.toggle('open',value);$('workspace-menu').inert=!value;if(value&&keyboard)$('workspace-list').querySelector('[aria-checked=true]').focus();}
      function toast(message){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);toastTimer=setTimeout(()=>el.remove(),3200)}
      function createProject(){editing=false;$('dialog-title').textContent='새 프로젝트';$('project-name').value='';$('project-dialog').showModal();$('project-name').focus()}
      $('switch').addEventListener('click',event=>{event.stopPropagation();setOpen(!open,event.detail===0)});
      $('switch').addEventListener('keydown',event=>{if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();setOpen(true,true)}});
      $('workspace-menu').addEventListener('keydown',event=>{const items=[...$('workspace-menu').querySelectorAll('button')];const index=items.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?items.length-1:(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;items[next].focus()}});
      document.addEventListener('click',event=>{const button=event.target.closest('button');if(button?.hasAttribute('data-space')){current=Number(button.dataset.space);setOpen(false);$('search').value='';archived=false;header();gallery(true);$('switch').focus({preventScroll:true});$('live').textContent=`${spaces[current].name} 워크스페이스로 전환했습니다.`;return}if(button?.hasAttribute('data-create')){createProject();return}if(button?.dataset.manage){selected=spaces[current].projects.find(p=>p.id===Number(button.dataset.manage));$('manage-title').textContent=selected.name;$('archive').textContent=selected.archived?'보관 해제':'보관하기';$('manage-dialog').showModal();return}if(button?.hasAttribute('data-cancel')){button.closest('dialog').close();return}if(button?.dataset.open){toast('갤러리 목업입니다. 편집기는 승인 후 연결합니다.');return}if(button?.dataset.info){setOpen(false);toast(`${button.dataset.info} · 상세 화면은 승인 후 구현합니다.`)}if(open&&!event.target.closest('.workspace-anchor'))setOpen(false)});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&open){event.preventDefault();setOpen(false);$('switch').focus()}});
      document.addEventListener('focusin',event=>{if(open&&!event.target.closest('.workspace-anchor'))setOpen(false)});
      $('search').addEventListener('input',()=>gallery());$('sort').addEventListener('change',()=>gallery());$('all').addEventListener('click',()=>{archived=false;gallery(true)});$('archived').addEventListener('click',()=>{archived=true;gallery(true)});
      $('rename').addEventListener('click',()=>{editing=true;$('manage-dialog').close();$('dialog-title').textContent='프로젝트 이름 변경';$('project-name').value=selected.name;$('project-dialog').showModal();$('project-name').focus()});
      $('archive').addEventListener('click',()=>{selected.archived=!selected.archived;$('manage-dialog').close();header();gallery();toast(selected.archived?'프로젝트를 보관했어요. 보관함에서 다시 꺼낼 수 있어요.':'프로젝트의 보관을 해제했어요.')});
      $('project-form').addEventListener('submit',event=>{event.preventDefault();const name=$('project-name').value.trim();if(!name){$('project-name').setCustomValidity('프로젝트 이름을 입력해 주세요.');$('project-name').reportValidity();return}if(editing){selected.name=name;selected.time='방금'}else{spaces[current].projects.unshift({id:Date.now(),name,tables:0,relations:0,time:'방금',entities:['new_table','new_relation']});archived=false;$('search').value=''}$('project-dialog').close();header();gallery(true);toast(editing?'프로젝트 이름을 변경했어요.':'샘플 프로젝트를 만들었어요.')});$('project-name').addEventListener('input',()=>$('project-name').setCustomValidity(''));
      header();gallery();
    </script>
  </body>
</html>
