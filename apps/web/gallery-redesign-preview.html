  <body>
    <div class="preview-bar">
      미리보기 — 승인 전 <span>모든 변경은 샘플에만 적용되며, 새로고침하면 초기화됩니다.</span>
    </div>
    <header class="app-header">
      <div class="left-header">
        <button class="brand" aria-label="EZERD 프로젝트 갤러리" data-home>
          EZERD<span>.</span>
        </button>
        <span class="header-divider"></span>
        <div class="workspace-anchor">
          <button
            id="switch"
            class="switch-trigger ui-button ui-button--secondary"
            aria-expanded="false"
            aria-controls="workspace-menu"
            aria-haspopup="menu"
          ></button>
          <div id="workspace-menu" class="panel dropdown" inert>
            <div class="panel-header">워크스페이스 <span>2개의 공간</span></div>
            <div
              id="workspace-list"
              class="workspace-list"
              role="menu"
              aria-label="워크스페이스 선택"
            ></div>
            <div class="panel-actions">
              <button class="action" data-info="워크스페이스 설정">
                <svg
                  class="icon"
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="m9 3 .8-1h4.4l.8 1 .4 2 1.7 1 2-.6 1.2 1 1.2 2-.4 1.5-1.5 1.4v2l1.5 1.4.4 1.5-1.2 2-1.2 1-2-.6-1.7 1-.4 2-.8 1H9l-.8-1-.4-2-1.7-1-2 .6-1.2-1-1.2-2 .4-1.5L3.6 13v-2L2.1 9.6l-.4-1.5 1.2-2 1.2-1 2 .6 1.7-1L8.2 3Z"
                  />
                  <circle cx="11.5" cy="12" r="3" /></svg
                >워크스페이스 설정</button
              ><button class="action" data-info="대기 중인 초대">
                <svg
                  class="icon"
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M5 19 19 5M6 5h13v13" /></svg
                >대기 중인 초대 <span class="badge">1</span></button
              ><button class="action" data-info="새 워크스페이스 만들기">
                <svg
                  class="icon"
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 5v14M5 12h14" /></svg
                >새 워크스페이스 만들기
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="right-header">
        <button class="quiet" data-info="도움말">도움말 ↗</button>
        <button
          class="ui-button ui-button--secondary ui-icon-button notification-button"
          data-info="알림"
          aria-label="알림"
          title="알림"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
          </svg>
        </button>
        <button
          class="ui-button ui-button--secondary user-button"
          data-info="내 프로필"
          aria-label="TY, 사용자 메뉴"
        >
          <span class="ui-avatar ui-avatar--xs">T</span><span class="user-name">TY</span
          ><span aria-hidden="true">⌄</span>
        </button>
      </div>
    </header>
    <main class="main">
      <div class="section-marker">01 / WORKSPACE<span></span></div>
      <div class="page-heading gallery-hero">
        <div>
          <p id="eyebrow" class="eyebrow">도메인에서 시작하는 데이터 설계</p>
          <h1><span id="workspace-title"></span><span class="title-dot">.</span></h1>
          <p class="subline">아이디어를 구조로, 함께 만드는 데이터 설계.</p>
        </div>
        <button class="ui-button ui-button--primary create-erd" data-create>
          ＋ &nbsp;새 프로젝트
        </button>
      </div>
      <div class="toolbar">
        <div class="tabs">
          <button class="tab active" id="all" aria-pressed="true">
            전체 프로젝트 <span class="count" id="count"></span></button
          ><button class="tab" id="archived" aria-pressed="false">
            보관함 <span id="archived-count"></span>
          </button>
        </div>
        <div class="toolbar-right">
          <label class="search"
            ><span aria-hidden="true">⌕</span
            ><input
              id="search"
              placeholder="프로젝트 검색"
              aria-label="프로젝트 검색"
              type="search"
          /></label>
          <div class="sort-anchor">
            <button
              class="sort"
              id="sort"
              aria-label="프로젝트 정렬"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="sort-menu"
            >
              최근 수정순 <span aria-hidden="true">⌄</span>
            </button>
            <div id="sort-menu" class="compact-menu" role="menu" aria-label="프로젝트 정렬" hidden>
              <button role="menuitemradio" aria-checked="true" data-sort="recent">
                최근 수정순 <span>✓</span></button
              ><button role="menuitemradio" aria-checked="false" data-sort="name">
                이름순 <span></span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <section class="gallery" id="gallery" aria-label="프로젝트 목록"></section>
      <div class="page-foot">
        <span class="dot"></span><span id="foot"></span
        ><span style="margin-left:auto">소유자 · TY</span>
      </div>
    </main>
    <dialog
      class="confirmation-dialog rename-dialog"
      id="project-dialog"
      aria-labelledby="dialog-title"
    >
      <form id="project-form">
        <h2 id="dialog-title">새 프로젝트</h2>
        <p>선택한 워크스페이스에 새로운 설계를 추가합니다.</p>
        <label for="project-name">프로젝트 이름</label>
        <div class="ui-input-group">
          <input
            class="ui-input"
            id="project-name"
            maxlength="60"
            required
            autocomplete="off"
            placeholder="예: service-backend"
          />
        </div>
        <fieldset id="database-field">
          <legend>데이터베이스</legend>
          <div class="database-options">
            <label
              ><input type="radio" name="database" value="PostgreSQL" checked /><span
                >PostgreSQL</span
              ></label
            >
            <label><input type="radio" name="database" value="MySQL" /><span>MySQL</span></label>
            <label><input type="radio" name="database" value="SQLite" /><span>SQLite</span></label>
          </div>
          <p class="database-hint">선택한 종류가 프로젝트 카드에 표시됩니다.</p>
        </fieldset>
        <div class="confirmation-dialog-actions">
          <button type="button" class="ui-button ui-button--secondary" data-cancel>취소</button
          ><button class="ui-button ui-button--primary" type="submit">확인</button>
        </div>
      </form>
    </dialog>
    <div
      id="manage-menu"
      class="compact-menu project-menu"
      role="menu"
      aria-label="프로젝트 관리"
      hidden
    >
      <button role="menuitem" id="rename">이름 변경</button
      ><button role="menuitem" id="export">내보내기</button
      ><button role="menuitem" id="archive">보관하기</button>
    </div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <script>
      const $ = id => document.getElementById(id);
      const spaces=[{name:'Edusync',initial:'E',projects:[{id:1,name:'klassboard-backend',tables:18,relations:14,time:'2시간 전',entities:['users','classrooms']}]},{name:'TY',initial:'T',projects:[{id:2,name:'ezerd',tables:12,relations:8,time:'어제',entities:['projects','tables']},{id:3,name:'monya',tables:8,relations:4,time:'어제',entities:['accounts','transactions']}]}];
      let current=0,open=false,archived=false,selected=null,editing=false,toastTimer,sort='recent',menuTrigger=null;
      const escapeHTML=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const avatar=s=>`<span class="avatar ${s.initial==='T'?'ty':''}">${s.initial}</span>`;
      function header(){const s=spaces[current];$('switch').innerHTML=`${avatar(s)}<span class="trigger-copy">${s.name}</span><svg class="chevron" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>`;$('switch').setAttribute('aria-label',`${s.name}, 워크스페이스 선택`);$('workspace-list').innerHTML=spaces.map((s,i)=>`<button class="workspace-row ${i===current?'selected':''}" role="menuitemradio" aria-checked="${i===current}" data-space="${i}">${avatar(s)}<span class="row-label"><strong>${s.name}</strong><small>소유자 · 프로젝트 ${s.projects.filter(p=>!p.archived).length}개</small></span>${i===current?'<span class="selected-check" aria-hidden="true">✓</span>':''}</button>`).join('');$('workspace-title').textContent=s.name;$('foot').textContent=`${s.name}의 프로젝트만 보고 있어요`;}
      function gallery(animate=false){closeMenus();const s=spaces[current];const query=$('search').value.trim().toLowerCase();let projects=s.projects.filter(p=>Boolean(p.archived)===archived&&p.name.toLowerCase().includes(query));if(sort==='name')projects=[...projects].sort((a,b)=>a.name.localeCompare(b.name));$('count').textContent=s.projects.filter(p=>!p.archived).length;$('archived-count').textContent=s.projects.filter(p=>p.archived).length?`· ${s.projects.filter(p=>p.archived).length}`:'';for(const id of ['all','archived']){const active=(id==='archived')===archived;$(id).classList.toggle('active',active);$(id).setAttribute('aria-pressed',active)}$('gallery').innerHTML=projects.map(p=>`<article class="erd-card"><button class="card-open" data-open="${p.id}" aria-label="${escapeHTML(p.name)} 프로젝트 열기"><div class="preview"><div class="diagram">${p.entities.map((name,i)=>`<div class="mini-table ${i?'offset':''}"><b>${name}</b><span>⌑ id <i>uuid</i></span><span>${i?'↳ '+p.entities[0]+'_id':'name'} <i>${i?'uuid':'varchar'}</i></span><span>${i?'title':'created_at'} <i>${i?'varchar':'date'}</i></span>${i?'<span>updated_at <i>date</i></span>':''}</div>`).join('')}</div></div><div class="card-copy"><div class="card-title">${escapeHTML(p.name)}</div><div class="card-detail">테이블 ${p.tables}개 &nbsp;·&nbsp; 관계 ${p.relations}개</div><div class="card-footer"><span class="db-tag">${p.database||'PostgreSQL'}</span><span>${p.time} 수정</span></div></div></button><button class="more" data-manage="${p.id}" aria-label="${escapeHTML(p.name)} 프로젝트 관리" aria-haspopup="menu" aria-expanded="false" aria-controls="manage-menu">⋯</button></article>`).join('')+(!archived&&!query?'<button class="new-card" data-create><span class="plus">＋</span><strong>새 프로젝트</strong><small>새로운 데이터 설계를 시작하세요</small><span class="tile-footer">이름과 데이터베이스를 선택해 만들기</span></button>':'')+(!projects.length&&(archived||query)?'<p class="empty">'+(query?'검색 결과가 없어요.':'보관된 프로젝트가 없어요.')+'</p>':'');if(animate){$('gallery').classList.remove('enter');requestAnimationFrame(()=>$('gallery').classList.add('enter'))}}
      function setOpen(value,keyboard=false){open=value;$('switch').setAttribute('aria-expanded',value);$('workspace-menu').classList.toggle('open',value);$('workspace-menu').inert=!value;if(value&&keyboard)$('workspace-list').querySelector('[aria-checked=true]').focus();}
      function toast(message){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);toastTimer=setTimeout(()=>el.remove(),3200)}
      function createProject(){closeMenus();setOpen(false);editing=false;$('database-field').hidden=false;document.querySelector('[name=database][value=PostgreSQL]').checked=true;$('dialog-title').textContent='새 프로젝트';$('project-name').value='';$('project-dialog').showModal();$('project-name').focus()}
      $('switch').addEventListener('click',event=>{event.stopPropagation();setOpen(!open,event.detail===0)});
      $('switch').addEventListener('keydown',event=>{if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();setOpen(true,true)}});
      $('workspace-menu').addEventListener('keydown',event=>{const items=[...$('workspace-menu').querySelectorAll('button')];const index=items.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?items.length-1:(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;items[next].focus()}});
      document.addEventListener('click',event=>{const button=event.target.closest('button');if(!event.target.closest('.sort-anchor')&&!event.target.closest('#manage-menu')&&!button?.dataset.manage)closeMenus();if(button?.hasAttribute('data-home')){archived=false;$('search').value='';gallery(true);return}if(button?.hasAttribute('data-space')){current=Number(button.dataset.space);setOpen(false);$('search').value='';archived=false;header();gallery(true);$('switch').focus({preventScroll:true});$('live').textContent=`${spaces[current].name} 워크스페이스로 전환했습니다.`;return}if(button?.hasAttribute('data-create')){createProject();return}if(button?.dataset.manage){selected=spaces[current].projects.find(p=>p.id===Number(button.dataset.manage));const wasOpen=menuTrigger===button&&!$('manage-menu').hidden;closeMenus();setOpen(false);if(!wasOpen){menuTrigger=button;button.setAttribute('aria-expanded','true');$('archive').textContent=selected.archived?'보관 해제':'보관하기';$('manage-menu').hidden=false;const rect=button.getBoundingClientRect();$('manage-menu').style.left=Math.max(8,Math.min(rect.right-166,innerWidth-174))+'px';$('manage-menu').style.top=Math.max(8,Math.min(rect.bottom+6,innerHeight-$('manage-menu').offsetHeight-8))+'px';if(event.detail===0)$('rename').focus()}return}if(button?.hasAttribute('data-cancel')){button.closest('dialog').close();return}if(button?.dataset.open){toast('갤러리 목업입니다. 편집기는 승인 후 연결합니다.');return}if(button?.dataset.info){setOpen(false);toast(`${button.dataset.info} · 상세 화면은 승인 후 구현합니다.`)}if(open&&!event.target.closest('.workspace-anchor'))setOpen(false)});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&(!$('sort-menu').hidden||!$('manage-menu').hidden)){event.preventDefault();const trigger=menuTrigger||$('sort');closeMenus();trigger.focus();return}if(event.key==='Escape'&&open){event.preventDefault();setOpen(false);$('switch').focus()}});
      document.addEventListener('focusin',event=>{if(open&&!event.target.closest('.workspace-anchor'))setOpen(false)});
      $('search').addEventListener('input',()=>gallery());$('all').addEventListener('click',()=>{archived=false;gallery(true)});$('archived').addEventListener('click',()=>{archived=true;gallery(true)});
      $('rename').addEventListener('click',()=>{editing=true;closeMenus();$('database-field').hidden=true;$('dialog-title').textContent='프로젝트 이름 변경';$('project-name').value=selected.name;$('project-dialog').showModal();$('project-name').focus()});
      $('archive').addEventListener('click',()=>{selected.archived=!selected.archived;closeMenus();header();gallery();toast(selected.archived?'프로젝트를 보관했어요. 보관함에서 다시 꺼낼 수 있어요.':'프로젝트의 보관을 해제했어요.')});
      $('project-form').addEventListener('submit',event=>{event.preventDefault();const name=$('project-name').value.trim();if(!name){$('project-name').setCustomValidity('프로젝트 이름을 입력해 주세요.');$('project-name').reportValidity();return}if(editing){selected.name=name;selected.time='방금'}else{spaces[current].projects.unshift({id:Date.now(),name,database:document.querySelector('[name=database]:checked').value,tables:0,relations:0,time:'방금',entities:['new_table','new_relation']});archived=false;$('search').value=''}$('project-dialog').close();header();gallery(true);toast(editing?'프로젝트 이름을 변경했어요.':'샘플 프로젝트를 만들었어요.')});$('project-name').addEventListener('input',()=>$('project-name').setCustomValidity(''));
      function closeMenus(){ $('sort-menu').hidden=true;$('sort').setAttribute('aria-expanded','false');$('manage-menu').hidden=true;menuTrigger?.setAttribute('aria-expanded','false');menuTrigger=null; }
      $('sort').addEventListener('click',event=>{const visible=$('sort-menu').hidden;closeMenus();setOpen(false);$('sort-menu').hidden=!visible;$('sort').setAttribute('aria-expanded',visible);if(visible&&event.detail===0)$('sort-menu').querySelector('[aria-checked=true]').focus()});
      $('sort-menu').addEventListener('click',event=>{const option=event.target.closest('[data-sort]');if(!option)return;sort=option.dataset.sort;$('sort').innerHTML=(sort==='name'?'이름순':'최근 수정순')+' <span aria-hidden="true">⌄</span>';for(const item of $('sort-menu').querySelectorAll('button')){item.setAttribute('aria-checked',item.dataset.sort===sort);item.querySelector('span').textContent=item.dataset.sort===sort?'✓':''}gallery();$('sort').focus()});
      for(const id of ['sort-menu','manage-menu'])$(id).addEventListener('keydown',event=>{const items=[...$(id).querySelectorAll('button')];const index=items.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();items[event.key==='Home'?0:event.key==='End'?items.length-1:(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length].focus()}});
      for(const id of ['sort'])$(id).addEventListener('keydown',event=>{if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();if($('sort-menu').hidden)$(id).click();$('sort-menu').querySelector('button').focus()}});
      $('switch').addEventListener('click',closeMenus);
      window.addEventListener('resize',closeMenus);window.addEventListener('scroll',closeMenus);
      document.addEventListener('focusin',event=>{if(!$('sort-menu').hidden&&!event.target.closest('.sort-anchor'))closeMenus();if(!$('manage-menu').hidden&&!event.target.closest('#manage-menu')&&event.target!==menuTrigger)closeMenus()});
      $('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(selected,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=selected.name+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closeMenus();toast('샘플 프로젝트를 JSON으로 내보냈어요.')});
      header();gallery();
    </script>
  </body>
</html>
