name: ezerd-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm setup first}
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
